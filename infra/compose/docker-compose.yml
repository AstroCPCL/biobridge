version: "3.8"

services:
  # ===========================================================================
  # DATABASE
  # ===========================================================================
  db:
    image: postgres:15-alpine
    container_name: biobridge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biobridge}
      POSTGRES_USER: ${POSTGRES_USER:-biobridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biobridge} -d ${POSTGRES_DB:-biobridge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # BACKEND (FastAPI)
  # ===========================================================================
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    container_name: biobridge-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - BIOBRIDGE_MODE=${BIOBRIDGE_MODE:-sim}
      - BIOBRIDGE_DEBUG=${BIOBRIDGE_DEBUG:-false}
      - BIOBRIDGE_LOG_LEVEL=${BIOBRIDGE_LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-biobridge}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-biobridge}
      - BACKEND_HOST=${BACKEND_HOST:-0.0.0.0}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - ACQUISITION_INTERVAL_SECONDS=${ACQUISITION_INTERVAL_SECONDS:-5}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../../backend:/app
    # Uncomment for GPIO access on Raspberry Pi:
    # privileged: true
    # devices:
    #   - /dev/gpiomem:/dev/gpiomem
    #   - /dev/i2c-1:/dev/i2c-1
    #   - /dev/spidev0.0:/dev/spidev0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # FRONTEND (React + Vite)
  # ===========================================================================
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: biobridge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # CLOUDFLARE TUNNEL (Optional - uncomment to enable)
  # ===========================================================================
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: biobridge-tunnel
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - frontend
  #     - backend

volumes:
  pgdata:
    driver: local

networks:
  default:
    name: biobridge-network
